on:
  # A publishing repository dispatches this directly so a release reaches the
  # bucket in minutes rather than on the next sweep. The cron below stays as the
  # safety net for anything that cannot dispatch, and for releases published by
  # hand.
  workflow_dispatch:
  schedule:
    # Hourly. A sweep only ever packages whichever release is newest when it
    # fires, and GitHub runs these late -- 32 to 52 minutes past the hour, here
    # -- so anything published between two sweeps is skipped rather than queued.
    - cron: '0 */1 * * *'
name: Excavator
jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Excavate
        uses: ScoopInstaller/GithubActions@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: 1
